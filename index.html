<!DOCTYPE html>
<html lang="en-GB" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Harmonisation Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: { 850: '#202024', 950: '#09090b' },
                        neon: { blue: '#3b82f6', gold: '#fbbf24', red: '#ef4444' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #09090b; color: #f4f4f5; }
        
        /* Premium Keyboard Styles */
        .kb-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            background: #18181b;
            border-radius: 8px;
            padding: 12px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.8);
            user-select: none;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            align-items: center;
        }

        .kb-container {
            position: relative;
            height: 100%;
            display: flex;
            min-width: 800px;
            width: 100%;
        }

        /* White Keys */
        .key-white {
            flex: 1;
            background: linear-gradient(to bottom, #ffffff 0%, #e4e4e7 100%);
            border: 1px solid #a1a1aa;
            border-radius: 0 0 6px 6px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            color: #3f3f46;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            cursor: pointer;
            margin-right: 2px;
        }
        .key-white:last-child { margin-right: 0; }
        
        /* Black Keys */
        .key-black {
            position: absolute;
            background: linear-gradient(to bottom, #18181b 0%, #000000 100%);
            border: 1px solid #000;
            border-radius: 0 0 4px 4px;
            z-index: 2;
            height: 62%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            color: #a1a1aa;
            font-size: 0.75rem;
            box-shadow: inset 0 -2px 3px rgba(255,255,255,0.1), 0 4px 8px rgba(0,0,0,0.6);
            transition: all 0.1s ease;
            cursor: pointer;
        }

        /* Dynamic States */
        .key-white.active, .key-black.active { transform: translateY(2px); }
        
        .key-white.in-scale { background: linear-gradient(to bottom, #f0f9ff 0%, #bae6fd 100%); border-color: #7dd3fc; }
        .key-black.in-scale { background: linear-gradient(to bottom, #1e3a8a 0%, #172554 100%); border-color: #3b82f6; color: #93c5fd; }
        
        .key-white.in-chord { background: linear-gradient(to bottom, #fef08a 0%, #facc15 100%) !important; border-color: #eab308; color: #713f12; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
        .key-black.in-chord { background: linear-gradient(to bottom, #ca8a04 0%, #854d0e 100%) !important; border-color: #fef08a; color: #fef08a; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }

        .key-white.is-root::after, .key-black.is-root::after {
            content: '';
            position: absolute;
            bottom: 35px;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
        }
        .key-black.is-root::after { bottom: 25px; }

        .out-of-scale { opacity: 0.15; pointer-events: none; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Circle of Fifths */
        .circle-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 260px;
            margin: 0 auto;
            border-radius: 50%;
            border: 1px dashed #3f3f46;
        }
        .circle-node {
            position: absolute;
            width: 36px;
            height: 36px;
            margin: -18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            background: #18181b;
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .circle-node.minor-node {
            width: 28px;
            height: 28px;
            margin: -14px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .circle-node.active-major { background: #3b82f6; color: white; border-color: #60a5fa; transform: scale(1.15); box-shadow: 0 0 15px rgba(59,130,246,0.6); z-index: 10;}
        .circle-node.active-minor { background: #fbbf24; color: #18181b; border-color: #fde047; transform: scale(1.15); box-shadow: 0 0 15px rgba(251,191,36,0.6); z-index: 10;}
        .circle-node.highlight-related { border-color: #a1a1aa; background: #27272a; color: #f4f4f5; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-7xl bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <header class="bg-zinc-950 border-b border-zinc-800 p-6 md:px-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Advanced <span class="text-neon-blue">Harmonisation</span> Matrix</h1>
                <p class="text-zinc-400 mt-1 text-sm tracking-wide uppercase">Music Theory & Synthesis Engine v2.1</p>
            </div>
            <button id="init-audio" class="px-5 py-2.5 bg-neon-blue hover:bg-blue-600 text-white font-semibold rounded-lg shadow-[0_0_15px_rgba(59,130,246,0.4)] transition-all">
                Initialise Audio Engine
            </button>
        </header>

        <div class="p-6 md:p-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Left Panel: Controls, Theory, & Circle -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Parameters -->
                <div class="bg-zinc-850 p-5 rounded-xl border border-zinc-800 shadow-inner">
                    <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-4">1. Global Parameters</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-zinc-300 mb-1">Root Key</label>
                            <select id="root-select" class="w-full bg-zinc-900 border border-zinc-700 text-white p-2.5 rounded-lg focus:ring-2 focus:ring-neon-blue focus:outline-none">
                                <option value="C">C</option><option value="C#">C# / Db</option><option value="D">D</option><option value="D#">D# / Eb</option>
                                <option value="E">E</option><option value="F">F</option><option value="F#">F# / Gb</option><option value="G">G</option>
                                <option value="G#">G# / Ab</option><option value="A" selected>A</option><option value="A#">A# / Bb</option><option value="B">B</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-zinc-300 mb-1">Mode / Scale</label>
                            <select id="mode-select" class="w-full bg-zinc-900 border border-zinc-700 text-white p-2.5 rounded-lg focus:ring-2 focus:ring-neon-blue focus:outline-none">
                                <option value="major">Major (Ionian)</option>
                                <option value="minor" selected>Natural Minor (Aeolian)</option>
                                <option value="harmonicMinor">Harmonic Minor</option>
                                <option value="dorian">Dorian</option>
                                <option value="mixolydian">Mixolydian</option>
                            </select>
                        </div>
                        <div class="pt-2">
                            <label class="flex items-center space-x-3 cursor-pointer">
                                <input type="checkbox" id="seventh-toggle" class="form-checkbox h-5 w-5 text-neon-blue rounded border-zinc-700 bg-zinc-900 focus:ring-neon-blue focus:ring-offset-zinc-900">
                                <span class="text-sm font-medium text-zinc-300">Enable 7th Chords</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Theory Analysis -->
                <div class="bg-zinc-850 p-5 rounded-xl border border-zinc-800 shadow-inner flex-grow">
                    <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-4">Theory Analysis</h2>
                    <div id="theory-panel" class="text-sm text-zinc-300 space-y-3">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Circle of Fifths -->
                <div class="bg-zinc-850 p-5 rounded-xl border border-zinc-800 shadow-inner">
                    <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-4 text-center">Circle of Fifths</h2>
                    <div class="circle-container mt-4 mb-2" id="circle-container">
                        <!-- Injected by JS -->
                    </div>
                </div>
            </div>

            <!-- Right Panel: Keyboard & Chords -->
            <div class="lg:col-span-3 space-y-8 flex flex-col">
                
                <!-- Diatonic Chords -->
                <div>
                    <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-4">2. Diatonic Harmony Matrix</h2>
                    <div id="chord-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
                        <!-- Chords injected here -->
                    </div>
                </div>

                <!-- Keyboard Interface -->
                <div class="flex-grow flex flex-col">
                    <div class="flex justify-between items-end mb-4">
                        <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-widest">3. Execution Interface</h2>
                        <button id="clear-kb" class="text-xs text-neon-blue hover:text-blue-400 font-medium tracking-wide">CLEAR HIGHLIGHTS</button>
                    </div>
                    
                    <div class="kb-wrapper">
                        <div class="kb-container" id="keyboard">
                            <!-- Keyboard DOM injected here -->
                        </div>
                    </div>
                    
                    <div class="mt-4 flex gap-6 text-xs text-zinc-500 justify-center">
                        <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-blue-900 border border-blue-500"></div> Diatonic (Safe)</div>
                        <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-yellow-500 border border-yellow-300"></div> Active Arpeggio</div>
                        <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-red-500"></div> Root Note</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    /** --- 1. CORE MUSIC THEORY DATA --- **/
    const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const CIRCLE_FIFTHS = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'C#', 'G#', 'D#', 'A#', 'F'];
    const INTERVAL_NAMES = { 0: 'P1', 1: 'm2', 2: 'M2', 3: 'm3', 4: 'M3', 5: 'P4', 6: 'd5/A4', 7: 'P5', 8: 'm6', 9: 'M6', 10: 'm7', 11: 'M7' };
    
    const SCALES = {
        major: { name: "Major (Ionian)", intervals: [2, 2, 1, 2, 2, 2, 1], numerals: ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'] },
        minor: { name: "Natural Minor (Aeolian)", intervals: [2, 1, 2, 2, 1, 2, 2], numerals: ['i', 'ii°', 'III', 'iv', 'v', 'VI', 'VII'] },
        harmonicMinor: { name: "Harmonic Minor", intervals: [2, 1, 2, 2, 1, 3, 1], numerals: ['i', 'ii°', 'III+', 'iv', 'V', 'VI', 'vii°'] },
        dorian: { name: "Dorian", intervals: [2, 1, 2, 2, 2, 1, 2], numerals: ['i', 'ii', 'III', 'IV', 'v', 'vi°', 'VII'] },
        mixolydian: { name: "Mixolydian", intervals: [2, 2, 1, 2, 2, 1, 2], numerals: ['I', 'ii', 'iii°', 'IV', 'v', 'vi', 'VII'] }
    };

    /** --- 2. STATE --- **/
    let state = {
        rootIndex: 9, // A
        modeKey: 'minor',
        useSevenths: false,
        scaleIndices: [],
        activeArpeggio: [],
        activeRootIndex: null
    };

    /** --- 3. ADVANCED AUDIO ENGINE --- **/
    let audioCtx = null;
    let masterGain = null;
    let compressor = null;

    document.getElementById('init-audio').addEventListener('click', (e) => {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Build Master Compression Bus to prevent clipping
            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-15, audioCtx.currentTime);
            compressor.knee.setValueAtTime(10, audioCtx.currentTime);
            compressor.ratio.setValueAtTime(6, audioCtx.currentTime);
            compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
            compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.5; // Master headroom

            masterGain.connect(compressor);
            compressor.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        e.target.textContent = "Audio Engine Active";
        e.target.classList.replace('bg-neon-blue', 'bg-zinc-700');
        e.target.classList.replace('hover:bg-blue-600', 'hover:bg-zinc-600');
        e.target.classList.remove('shadow-[0_0_15px_rgba(59,130,246,0.4)]');
    });

    function playChordTone(noteAbsoluteIndex, octaveOffset = 3) {
        if (!audioCtx || !masterGain) return;
        
        const freq = 130.81 * Math.pow(2, (noteAbsoluteIndex + (octaveOffset - 3) * 12) / 12);
        
        // Rhodes-style synthesis (Sine + Triangle with Low Pass)
        const osc1 = audioCtx.createOscillator(); // Fundamental
        const osc2 = audioCtx.createOscillator(); // Harmonics
        const filter = audioCtx.createBiquadFilter();
        const noteGain = audioCtx.createGain();
        
        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.value = freq;
        osc2.frequency.value = freq;

        filter.type = 'lowpass';
        filter.frequency.value = 800; // Remove harsh highs

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(noteGain);
        noteGain.connect(masterGain);
        
        osc1.start();
        osc2.start();
        
        // ADSR Envelope
        const now = audioCtx.currentTime;
        noteGain.gain.setValueAtTime(0, now);
        noteGain.gain.linearRampToValueAtTime(0.4, now + 0.02); // Fast Attack
        noteGain.gain.exponentialRampToValueAtTime(0.15, now + 0.2); // Decay
        noteGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5); // Smooth Release
        
        osc1.stop(now + 1.5);
        osc2.stop(now + 1.5);
    }

    /** --- 4. THEORY LOGIC --- **/
    function calculateScale() {
        state.scaleIndices = [];
        let curr = state.rootIndex;
        state.scaleIndices.push(curr % 12);
        
        const intervals = SCALES[state.modeKey].intervals;
        for (let i = 0; i < 6; i++) {
            curr += intervals[i];
            state.scaleIndices.push(curr % 12);
        }
    }

    function getChordNotes(degreeZeroIndexed) {
        const notes = [];
        notes.push(state.scaleIndices[degreeZeroIndexed]);
        notes.push(state.scaleIndices[(degreeZeroIndexed + 2) % 7]);
        notes.push(state.scaleIndices[(degreeZeroIndexed + 4) % 7]);
        
        if (state.useSevenths) {
            notes.push(state.scaleIndices[(degreeZeroIndexed + 6) % 7]);
        }
        return notes;
    }

    function analyzeChord(chordNotes) {
        const root = chordNotes[0];
        let name = NOTES[root];
        
        const intervals = chordNotes.map(n => {
            let diff = n - root;
            if (diff < 0) diff += 12;
            return diff;
        });

        const hasM3 = intervals.includes(4);
        const hasm3 = intervals.includes(3);
        const hasP5 = intervals.includes(7);
        const hasd5 = intervals.includes(6);
        const hasA5 = intervals.includes(8);
        const hasm7 = intervals.includes(10);
        const hasM7 = intervals.includes(11);

        let quality = "";
        
        if (hasM3 && hasP5) quality = "Maj";
        else if (hasm3 && hasP5) quality = "min";
        else if (hasm3 && hasd5) quality = "dim";
        else if (hasM3 && hasA5) quality = "aug";
        
        if (state.useSevenths) {
            if (quality === "Maj" && hasM7) quality = "Maj7";
            else if (quality === "Maj" && hasm7) quality = "7"; 
            else if (quality === "min" && hasm7) quality = "m7";
            else if (quality === "min" && hasM7) quality = "m(maj7)";
            else if (quality === "dim" && hasm7) quality = "m7b5"; 
            else if (quality === "dim" && intervals.includes(9)) quality = "dim7"; 
        } else {
            if (quality === "min") quality = "m";
            if (quality === "dim") quality = "°";
            if (quality === "aug") quality = "+";
            if (quality === "Maj") quality = "";
        }

        return { name: name + quality, intervalsStruct: intervals.map(i => INTERVAL_NAMES[i]) };
    }

    /** --- 5. RENDER LOGIC --- **/
    function renderKeyboard() {
        const kb = document.getElementById('keyboard');
        kb.innerHTML = '';
        
        const NUM_OCTAVES = 3;
        const totalWhiteKeys = NUM_OCTAVES * 7;
        const blackKeyOffsets = { 1: 0, 3: 1, 6: 3, 8: 4, 10: 5 };
        const whiteKeyNotes = [0, 2, 4, 5, 7, 9, 11];

        let currentWhiteIndex = 0;

        for (let oct = 0; oct < NUM_OCTAVES; oct++) {
            for (let i = 0; i < 12; i++) {
                const noteAbs = i;
                const isWhite = whiteKeyNotes.includes(noteAbs);
                const isScale = state.scaleIndices.includes(noteAbs);
                const isArp = state.activeArpeggio.includes(noteAbs);
                const isRoot = state.activeRootIndex === noteAbs;

                const div = document.createElement('div');
                div.className = `${isWhite ? 'key-white' : 'key-black'} ${isScale ? 'in-scale' : 'out-of-scale'} ${isArp ? 'in-chord' : ''} ${isRoot ? 'is-root' : ''}`;
                
                if (isWhite) {
                    div.innerHTML = `<span>${NOTES[noteAbs]}</span>`;
                    kb.appendChild(div);
                    currentWhiteIndex++;
                } else {
                    const whiteWidthPercent = 100 / totalWhiteKeys;
                    const prevWhiteGlobalIndex = (oct * 7) + blackKeyOffsets[noteAbs];
                    div.style.left = `calc(${whiteWidthPercent * (prevWhiteGlobalIndex + 1)}% - 1.5%)`; 
                    div.style.width = '3%'; 
                    div.innerHTML = `<span>${NOTES[noteAbs]}</span>`;
                    kb.appendChild(div);
                }

                div.addEventListener('mousedown', () => {
                    div.classList.add('active');
                    playChordTone(noteAbs, oct + 3);
                });
                div.addEventListener('mouseup', () => div.classList.remove('active'));
                div.addEventListener('mouseleave', () => div.classList.remove('active'));
            }
        }
    }

    function renderChords() {
        const container = document.getElementById('chord-container');
        container.innerHTML = '';
        const numerals = SCALES[state.modeKey].numerals;

        for (let i = 0; i < 7; i++) {
            const chordNotes = getChordNotes(i);
            const analysis = analyzeChord(chordNotes);
            const btn = document.createElement('button');
            btn.className = "flex flex-col items-center justify-center p-3 bg-zinc-850 border border-zinc-700 hover:border-neon-blue hover:bg-zinc-800 rounded-lg transition-all text-center";
            
            let displayNumeral = numerals[i];
            if (state.useSevenths) displayNumeral += "7";

            btn.innerHTML = `
                <span class="text-xs font-semibold text-zinc-500 mb-1">${displayNumeral}</span>
                <span class="text-xl font-bold text-white">${analysis.name}</span>
            `;

            btn.addEventListener('click', () => activateChord(chordNotes, analysis.name, displayNumeral, analysis.intervalsStruct));
            container.appendChild(btn);
        }
    }

    function activateChord(chordNotes, chordName, numeral, intervalStruct) {
        state.activeArpeggio = chordNotes;
        state.activeRootIndex = chordNotes[0];
        
        chordNotes.forEach((note, index) => {
            let oct = 3;
            if (index > 0 && note <= chordNotes[0]) oct = 4; 
            playChordTone(note, oct);
        });

        const panel = document.getElementById('theory-panel');
        const notesNames = chordNotes.map(n => NOTES[n]).join(' - ');
        const struct = intervalStruct.join(' - ');
        
        panel.innerHTML = `
            <div class="border-b border-zinc-700 pb-2 mb-2">
                <span class="block text-xs text-zinc-500 uppercase">Active Key</span>
                <strong class="text-neon-blue text-lg">${NOTES[state.rootIndex]} ${SCALES[state.modeKey].name}</strong>
            </div>
            <div class="border-b border-zinc-700 pb-2 mb-2">
                <span class="block text-xs text-zinc-500 uppercase">Selected Chord</span>
                <strong class="text-neon-gold text-lg">${chordName} (${numeral})</strong>
            </div>
            <div>
                <span class="block text-xs text-zinc-500 uppercase">Arpeggio Footprint</span>
                <span class="text-zinc-200 block">${notesNames}</span>
                <span class="text-zinc-400 text-xs tracking-wider block mt-1">[ ${struct} ]</span>
            </div>
        `;
        renderKeyboard();
    }

    function resetTheoryPanel() {
        const panel = document.getElementById('theory-panel');
        panel.innerHTML = `
            <div>
                <span class="block text-xs text-zinc-500 uppercase">Active Key</span>
                <strong class="text-neon-blue text-lg">${NOTES[state.rootIndex]} ${SCALES[state.modeKey].name}</strong>
                <p class="text-zinc-400 mt-2 text-xs">Select a chord from the matrix to view intervallic breakdown.</p>
            </div>
        `;
    }

    function renderCircleOfFifths() {
        const container = document.getElementById('circle-container');
        container.innerHTML = '';
        
        // Container defines size via CSS aspect-ratio, use percentage for relative positioning
        const center = 50; 
        const radiusMaj = 40; 
        const radiusMin = 22; 

        CIRCLE_FIFTHS.forEach((note, index) => {
            const angle = (index * 30 - 90) * (Math.PI / 180);
            
            // Outer Ring (Major)
            const xMaj = center + radiusMaj * Math.cos(angle);
            const yMaj = center + radiusMaj * Math.sin(angle);
            
            const nodeMaj = document.createElement('div');
            nodeMaj.className = `circle-node`;
            nodeMaj.style.left = `${xMaj}%`;
            nodeMaj.style.top = `${yMaj}%`;
            nodeMaj.textContent = note;
            
            const noteIndex = NOTES.indexOf(note);
            if (state.modeKey === 'major' && state.rootIndex === noteIndex) {
                nodeMaj.classList.add('active-major');
            }

            // Inner Ring (Minor)
            const relMinorIndex = (index + 3) % 12;
            const relMinorNote = CIRCLE_FIFTHS[relMinorIndex];
            
            const xMin = center + radiusMin * Math.cos(angle);
            const yMin = center + radiusMin * Math.sin(angle);
            
            const nodeMin = document.createElement('div');
            nodeMin.className = `circle-node minor-node`;
            nodeMin.style.left = `${xMin}%`;
            nodeMin.style.top = `${yMin}%`;
            nodeMin.textContent = relMinorNote + 'm';

            const absMinorIndex = NOTES.indexOf(relMinorNote);
            if ((state.modeKey === 'minor' || state.modeKey === 'harmonicMinor') && state.rootIndex === absMinorIndex) {
                nodeMin.classList.add('active-minor');
                if (index === (CIRCLE_FIFTHS.indexOf(relMinorNote) - 3 + 12) % 12) {
                    nodeMaj.classList.add('highlight-related');
                }
            }

            container.appendChild(nodeMaj);
            container.appendChild(nodeMin);
        });
    }

    /** --- 6. BINDINGS --- **/
    function updateAll() {
        state.rootIndex = NOTES.indexOf(document.getElementById('root-select').value);
        state.modeKey = document.getElementById('mode-select').value;
        state.useSevenths = document.getElementById('seventh-toggle').checked;
        state.activeArpeggio = [];
        state.activeRootIndex = null;
        
        calculateScale();
        renderChords();
        renderKeyboard();
        resetTheoryPanel();
        renderCircleOfFifths();
    }

    document.getElementById('root-select').addEventListener('change', updateAll);
    document.getElementById('mode-select').addEventListener('change', updateAll);
    document.getElementById('seventh-toggle').addEventListener('change', updateAll);
    
    document.getElementById('clear-kb').addEventListener('click', () => {
        state.activeArpeggio = [];
        state.activeRootIndex = null;
        renderKeyboard();
        resetTheoryPanel();
    });

    // Boot
    updateAll();

</script>
</body>
</html>
